services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      # INTERNAL: other containers (kafka:9092); EXTERNAL: apps run from the host (localhost:9094)
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - '9094:9094'
    volumes:
      - kafka-data:/var/lib/kafka/data

  products-service:
    build:
      context: .
      args:
        APP: products
    environment:
      KAFKA_CLIENT_ID: products-service
      KAFKA_BROKER_ADDRESS: kafka:9092
      PORT: 3001
    volumes:
      - ./data:/data
    ports:
      - '3011:3001'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 3001']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      - kafka

  orders-service:
    build:
      context: .
      args:
        APP: orders
    environment:
      KAFKA_CLIENT_ID: orders-service
      KAFKA_BROKER_ADDRESS: kafka:9092
      PORT: 3002
    volumes:
      - ./data:/data
    ports:
      - '3002:3002'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 3002']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      - kafka

  inventory-service:
    build:
      context: .
      args:
        APP: inventory
    environment:
      KAFKA_CLIENT_ID: inventory-service
      KAFKA_BROKER_ADDRESS: kafka:9092
      PORT: 3003
    volumes:
      - ./data:/data
    ports:
      - '3003:3003'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 3003']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      - kafka

  graphql-gateway:
    build:
      context: .
      args:
        APP: graphql-gateway
    environment:
      PORT: 4000
    volumes:
      - ./apps/graphql-gateway/subgraphs.docker.json:/app/subgraphs.json:ro
    ports:
      - '4000:4000'
    restart: on-failure
    depends_on:
      products-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy

volumes:
  kafka-data:
